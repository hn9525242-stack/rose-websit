<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفاجأة خاصة ♥️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffdeeb;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 1.5s ease;
        }

        /* المرحلة الأولى: شاشة كيتي الوردية */
        #pink-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 1.2s ease, visibility 1.2s ease;
            padding: 20px;
            text-align: center;
        }

        #pink-screen.hide {
            opacity: 0;
            visibility: hidden;
        }

        .kitty-img {
            width: 140px;
            height: 140px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(0 5px 10px rgba(255, 105, 180, 0.4));
        }

        .question-text {
            color: #d63384;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 25px;
            text-shadow: 0 2px 5px rgba(255, 255, 255, 0.8);
        }

        .buttons-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            background-color: #ff69b4;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* المرحلة الثانية: الشاشة الوردية للرسم */
        #drawing-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.5s ease;
        }

        #drawing-screen.show {
            opacity: 1;
            visibility: visible;
        }

        canvas {
            display: block;
        }

        #message-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.85);
            text-align: center;
            opacity: 0;
            transition: opacity 2.5s ease-in-out, transform 2.5s ease-in-out;
            pointer-events: none;
            width: 88%;
            max-width: 550px;
            background: rgba(255, 255, 255, 0.75);
            padding: 25px 20px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 105, 180, 0.5);
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.3);
        }

        #message-box.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .main-text {
            color: #a81c51;
            font-size: 1.8rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .sub-text {
            color: #d63384;
            font-size: 1.6rem;
            font-weight: 600;
            text-shadow: 0 0 8px rgba(255, 182, 193, 0.9);
        }

        @media (max-width: 600px) {
            .main-text { font-size: 1.35rem; }
            .sub-text { font-size: 1.25rem; }
            .question-text { font-size: 1.6rem; }
            .btn { font-size: 1.1rem; padding: 10px 22px; }
        }
    </style>
</head>
<body>

    <!-- الشاشة الوردية الأولى -->
    <div id="pink-screen">
        <img id="kitty-img" class="kitty-img" src="https://upload.wikimedia.org/wikipedia/en/a/a6/Hello_Kitty_logo.svg" alt="Hello Kitty">
        <div id="question" class="question-text">تحبيني؟</div>
        
        <div id="step1-btns" class="buttons-container">
            <button class="btn" onclick="answerLove()">نعم</button>
            <button class="btn" onclick="answerLove()">طبعاً</button>
        </div>

        <div id="step2-btns" class="buttons-container" style="display: none;">
            <button class="btn" onclick="startRoseSequence()">نعم 🌹</button>
        </div>
    </div>

    <!-- الشاشة الوردية للرسم -->
    <div id="drawing-screen">
        <canvas id="roseCanvas"></canvas>
        <div id="message-box">
            <div class="main-text">الحمدلله ع السلامه بنوتاتي الحلوات ♥️🌸</div>
            <div class="sub-text">احبج</div>
        </div>
    </div>

    <script>
        const pinkScreen = document.getElementById('pink-screen');
        const drawingScreen = document.getElementById('drawing-screen');
        const questionText = document.getElementById('question');
        const step1Btns = document.getElementById('step1-btns');
        const step2Btns = document.getElementById('step2-btns');
        const kittyImg = document.getElementById('kitty-img');

        // الخطوة الأولى
        function answerLove() {
            questionText.innerText = "اني هم احبج ♥️";
            step1Btns.style.display = "none";
            
            kittyImg.src = "https://cdn.pixabay.com/photo/2021/01/21/14/10/hello-kitty-5937446_1280.png";

            setTimeout(() => {
                questionText.innerText = "تردين ورده؟ 🌹";
                step2Btns.style.display = "flex";
            }, 1800);
        }

        // بدء الرسم على الشاشة الوردية
        function startRoseSequence() {
            pinkScreen.classList.add('hide');
            document.body.style.backgroundColor = "#ffe3ee";
            
            setTimeout(() => {
                drawingScreen.classList.add('show');
                initCanvas();
                drawRose();
            }, 1000);
        }

        // --- كود الرسم ---
        const canvas = document.getElementById('roseCanvas');
        const ctx = canvas.getContext('2d');
        const messageBox = document.getElementById('message-box');

        let width, height, centerX, centerY, roseSize;

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            width = canvas.width;
            height = canvas.height;
            centerX = width / 2;
            centerY = height / 2;
            roseSize = Math.min(width, height) * 0.38;
        }

        let roseT = 0;
        const maxRoseT = 16 * Math.PI;

        function drawRose() {
            if (roseT < maxRoseT) {
                let k = 7 / 9;
                let r = roseSize * Math.sin(k * roseT);
                
                let x = r * Math.cos(roseT);
                let y = r * Math.sin(roseT);
                y -= Math.abs(x) * 0.1;

                ctx.beginPath();
                ctx.arc(centerX + x, centerY + y, 2.2, 0, Math.PI * 2);
                
                // أحمر قاني وداكن ليبرز على خلفية وردية
                let redVal = Math.floor(200 + Math.sin(roseT) * 55);
                ctx.fillStyle = `rgb(${redVal}, 10, 50)`;
                ctx.shadowColor = 'rgba(214, 51, 132, 0.4)';
                ctx.shadowBlur = 6;
                ctx.fill();

                roseT += 0.022;
                requestAnimationFrame(drawRose);
            } else {
                ctx.shadowBlur = 0;
                requestAnimationFrame(startHeartsDrawing);
            }
        }

        const heartCount = 12;
        let heartIndex = 0;
        let heartProgress = 0;

        function startHeartsDrawing() {
            const heartRadius = roseSize * 1.15;
            if (heartIndex < heartCount) {
                let angle = (heartIndex / heartCount) * Math.PI * 2;
                let hx = centerX + Math.cos(angle) * heartRadius;
                let hy = centerY + Math.sin(angle) * heartRadius;

                drawSingleHeart(hx, hy, 16, heartProgress);

                heartProgress += 0.05;

                if (heartProgress <= 1) {
                    requestAnimationFrame(startHeartsDrawing);
                } else {
                    heartProgress = 0;
                    heartIndex++;
                    requestAnimationFrame(startHeartsDrawing);
                }
            } else {
                setTimeout(() => {
                    messageBox.classList.add('show');
                }, 500);
            }
        }

        function drawSingleHeart(x, y, size, progress) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(progress, progress);
            
            ctx.beginPath();
            ctx.fillStyle = '#e6005c';
            ctx.shadowColor = '#ff69b4';
            ctx.shadowBlur = 10;

            let topCurveHeight = size * 0.3;
            ctx.moveTo(0, topCurveHeight);
            ctx.bezierCurveTo(0, 0, -size / 2, 0, -size / 2, topCurveHeight);
            ctx.bezierCurveTo(-size / 2, (size + topCurveHeight) / 2, 0, size, 0, size * 1.2);
            ctx.bezierCurveTo(0, size, size / 2, (size + topCurveHeight) / 2, size / 2, topCurveHeight);
            ctx.bezierCurveTo(size / 2, 0, 0, 0, 0, topCurveHeight);
            
            ctx.fill();
            ctx.restore();
        }

    </script>
</body>
</html>
