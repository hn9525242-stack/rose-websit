<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وردة حمراء وقلوب</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #020202;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
        }

        /* مربع النص بالمنتصف */
        #message-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.85);
            text-align: center;
            opacity: 0;
            transition: opacity 2.5s ease-in-out, transform 2.5s ease-in-out;
            pointer-events: none;
            width: 88%;
            max-width: 550px;
            background: rgba(0, 0, 0, 0.65);
            padding: 25px 20px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 77, 109, 0.3);
            box-shadow: 0 0 30px rgba(255, 0, 80, 0.3);
        }

        #message-box.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .main-text {
            color: #ffffff;
            font-size: 1.8rem;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.9), 0 0 30px rgba(255, 0, 80, 0.7);
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .sub-text {
            color: #ff4d6d;
            font-size: 1.6rem;
            font-weight: 600;
            text-shadow: 0 0 12px rgba(255, 77, 109, 1);
        }

        @media (max-width: 600px) {
            .main-text { font-size: 1.35rem; }
            .sub-text { font-size: 1.25rem; }
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="roseCanvas"></canvas>
        <div id="message-box">
            <div class="main-text">الحمدلله ع السلامه بنوتاتي الحلوات ♥️🌸</div>
            <div class="sub-text">احبج</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('roseCanvas');
        const ctx = canvas.getContext('2d');
        const messageBox = document.getElementById('message-box');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();

        const width = canvas.width;
        const height = canvas.height;
        const centerX = width / 2;
        const centerY = height / 2;

        // حجم الوردة الكبير جداً
        const roseSize = Math.min(width, height) * 0.38;

        let roseT = 0;
        const maxRoseT = 16 * Math.PI;

        // 1. رسم الوردة الحمراء الكبيرة جداً بهدوء
        function drawRose() {
            if (roseT < maxRoseT) {
                // رسم خطوة صغيرة جداً للحفاظ على البطء والجمالية
                let k = 7 / 9;
                let r = roseSize * Math.sin(k * roseT);
                
                let x = r * Math.cos(roseT);
                let y = r * Math.sin(roseT);

                // انحناء بتلات طبيعي
                y -= Math.abs(x) * 0.1;

                ctx.beginPath();
                ctx.arc(centerX + x, centerY + y, 2.2, 0, Math.PI * 2);
                
                // تدرجات أحمر مخملي فخم
                let redVal = Math.floor(190 + Math.sin(roseT) * 65);
                ctx.fillStyle = `rgb(${redVal}, 12, 42)`;
                ctx.shadowColor = 'rgba(255, 0, 50, 0.5)';
                ctx.shadowBlur = 8;
                ctx.fill();

                roseT += 0.022; // سرعة هادئة جداً ورائعة
                requestAnimationFrame(drawRose);
            } else {
                // إطفاء تأثير الظل لتخفيف الحمل
                ctx.shadowBlur = 0;
                // البدء برسم القلوب حول الوردة
                requestAnimationFrame(startHeartsDrawing);
            }
        }

        // 2. إعداد ورسم القلوب حول الوردة
        const heartCount = 12; // عدد القلوب المحيطة
        let heartIndex = 0;
        let heartProgress = 0;
        const heartRadius = roseSize * 1.15; // المسافة حول الوردة

        function startHeartsDrawing() {
            if (heartIndex < heartCount) {
                let angle = (heartIndex / heartCount) * Math.PI * 2;
                let hx = centerX + Math.cos(angle) * heartRadius;
                let hy = centerY + Math.sin(angle) * heartRadius;

                drawSingleHeart(hx, hy, 16, heartProgress);

                heartProgress += 0.05; // سرعة رسم القلب الواحد

                if (heartProgress <= 1) {
                    requestAnimationFrame(startHeartsDrawing);
                } else {
                    heartProgress = 0;
                    heartIndex++;
                    requestAnimationFrame(startHeartsDrawing);
                }
            } else {
                // 3. إظهار النص عند اكتمال كل شيء
                setTimeout(() => {
                    messageBox.classList.add('show');
                }, 500);
            }
        }

        // دالة رسم قلب واحد
        function drawSingleHeart(x, y, size, progress) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(progress, progress);
            
            ctx.beginPath();
            ctx.fillStyle = '#ff2a5f';
            ctx.shadowColor = '#ff4d6d';
            ctx.shadowBlur = 12;

            // معادلة رسم شكل القلب
            let topCurveHeight = size * 0.3;
            ctx.moveTo(0, topCurveHeight);
            ctx.bezierCurveTo(0, 0, -size / 2, 0, -size / 2, topCurveHeight);
            ctx.bezierCurveTo(-size / 2, (size + topCurveHeight) / 2, 0, size, 0, size * 1.2);
            ctx.bezierCurveTo(0, size, size / 2, (size + topCurveHeight) / 2, size / 2, topCurveHeight);
            ctx.bezierCurveTo(size / 2, 0, 0, 0, 0, topCurveHeight);
            
            ctx.fill();
            ctx.restore();
        }

        // بدء الرسم فوراً بالوردة
        drawRose();

    </script>
</body>
</html>
