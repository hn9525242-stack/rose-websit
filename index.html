<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌹</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

canvas {
    width: 100vw;
    height: 100vh;
}

#message {
    position: fixed;
    bottom: 7%;
    left: 0;
    width: 100%;
    text-align: center;
    direction: rtl;

    color: white;
    font-size: clamp(20px, 5vw, 38px);
    font-weight: bold;
    line-height: 1.8;

    opacity: 0;
    transition: opacity 2s ease;

    text-shadow: 0 0 12px white,
                 0 0 25px #ff1744;
}

#message.show {
    opacity: 1;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="message">
    الحمدلله ع السلامه بنوتاتي الحلوات
    <br>
    أحبج ♥️🌸
</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const message = document.getElementById("message");

let W = window.innerWidth;
let H = window.innerHeight;

canvas.width = W;
canvas.height = H;

const CX = W / 2;
const CY = H / 2;

const S = Math.min(W, H);

let lines = [];


/* =========================
   إضافة خط
========================= */

function addLine(x1, y1, x2, y2, color, width) {
    lines.push({
        x1, y1,
        x2, y2,
        color,
        width
    });
}


/* =========================
   رسم الساق
========================= */

function makeStem(x, startY, endY) {

    const steps = 80;

    for (let i = 0; i < steps; i++) {

        let a = i / steps;
        let b = (i + 1) / steps;

        let y1 = startY + (endY - startY) * a;
        let y2 = startY + (endY - startY) * b;

        let x1 = x + Math.sin(a * Math.PI) * 18;
        let x2 = x + Math.sin(b * Math.PI) * 18;

        addLine(
            x1, y1,
            x2, y2,
            "#238b35",
            6
        );
    }
}


/* =========================
   رسم ورقة
========================= */

function makeLeaf(x, y, size, side) {

    const steps = 35;

    for (let i = 0; i < steps; i++) {

        let a = i / steps;
        let b = (i + 1) / steps;

        let x1 = x + side * size * a;
        let x2 = x + side * size * b;

        let curve1 = Math.sin(a * Math.PI) * size * 0.25;
        let curve2 = Math.sin(b * Math.PI) * size * 0.25;

        addLine(
            x1,
            y - curve1,
            x2,
            y - curve2,
            "#2e963c",
            3
        );

        addLine(
            x1,
            y + curve1,
            x2,
            y + curve2,
            "#24782f",
            3
        );
    }

    /* عرق الورقة */

    addLine(
        x,
        y,
        x + side * size,
        y - size * 0.25,
        "#55b85b",
        2
    );
}


/* =========================
   رسم وردة 🌹
========================= */

function makeRose(cx, cy, size) {

    /*
       البتلات الخارجية
    */

    const turns = 4;
    const points = 180;

    let previous = null;

    for (let i = 0; i <= points; i++) {

        let t = i / points * Math.PI * 2 * turns;

        /*
           شكل الوردة
        */

        let r =
            size *
            Math.sin(5 * t);

        r = Math.abs(r);

        let x =
            cx + r * Math.cos(t);

        let y =
            cy + r * Math.sin(t);

        if (previous) {

            addLine(
                previous.x,
                previous.y,
                x,
                y,
                "rgba(230,20,55,0.9)",
                2.2
            );
        }

        previous = { x, y };
    }


    /*
       دوائر داخلية تعطي شكل البتلات
    */

    for (let ring = 1; ring <= 4; ring++) {

        let radius = size * ring * 0.11;

        let old = null;

        for (let i = 0; i <= 80; i++) {

            let a = i / 80 * Math.PI * 2;

            let x = cx + radius * Math.cos(a);
            let y = cy + radius * Math.sin(a);

            if (old) {

                addLine(
                    old.x,
                    old.y,
                    x,
                    y,
                    "#b51238",
                    1.5
                );
            }

            old = { x, y };
        }
    }

    /*
       مركز الوردة
    */

    for (let i = 0; i < 12; i++) {

        let a = i / 12 * Math.PI * 2;

        addLine(
            cx,
            cy,
            cx + size * 0.13 * Math.cos(a),
            cy + size * 0.13 * Math.sin(a),
            "#8b102d",
            2
        );
    }
}


/* =========================
   الساق الرئيسية
========================= */

const bottom = H * 0.88;
const top = H * 0.30;

makeStem(
    CX,
    bottom,
    top
);


/* =========================
   أوراق 🌿
========================= */

makeLeaf(
    CX,
    H * 0.72,
    S * 0.22,
    -1
);

makeLeaf(
    CX,
    H * 0.62,
    S * 0.20,
    1
);

makeLeaf(
    CX,
    H * 0.52,
    S * 0.17,
    -1
);

makeLeaf(
    CX,
    H * 0.43,
    S * 0.15,
    1
);


/* =========================
   الوردات 🌹🌹🌹
========================= */

makeRose(
    CX,
    H * 0.27,
    S * 0.15
);

makeRose(
    CX - S * 0.14,
    H * 0.40,
    S * 0.10
);

makeRose(
    CX + S * 0.14,
    H * 0.45,
    S * 0.10
);

makeRose(
    CX - S * 0.10,
    H * 0.55,
    S * 0.075
);

makeRose(
    CX + S * 0.10,
    H * 0.59,
    S * 0.075
);


/* =========================
   الرسم
========================= */

let index = 0;
let progress = 0;

/* أسرع شوي */

const SPEED = 0.045;

function animate() {

    if (index >= lines.length) {

        setTimeout(function() {
            message.classList.add("show");
        }, 700);

        return;
    }

    const p = lines[index];

    progress += SPEED;

    if (progress >= 1) {
        progress = 0;
        index++;
    }

    const x =
        p.x1 +
        (p.x2 - p.x1) * progress;

    const y =
        p.y1 +
        (p.y2 - p.y1) * progress;

    ctx.beginPath();

    ctx.moveTo(p.x1, p.y1);
    ctx.lineTo(x, y);

    ctx.strokeStyle = p.color;
    ctx.lineWidth = p.width;
    ctx.lineCap = "round";

    ctx.stroke();

    requestAnimationFrame(animate);
}

animate();


/* =========================
   عند تغيير حجم الشاشة
========================= */

window.addEventListener("resize", function() {
    location.reload();
});

</script>

</body>
</html>
