<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وردة حمراء أنيقة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #030303;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
        }

        /* رسالة النص التي تظهر بالمنتصف */
        #message-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            text-align: center;
            opacity: 0;
            transition: opacity 2.5s ease-in-out, transform 2.5s ease-in-out;
            pointer-events: none;
            width: 90%;
            max-width: 600px;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(4px);
        }

        #message-box.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .main-text {
            color: #ffffff;
            font-size: 1.8rem;
            font-weight: bold;
            text-shadow: 0 0 12px rgba(255, 105, 180, 0.8), 0 0 25px rgba(255, 0, 80, 0.6);
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .sub-text {
            color: #ff4d6d;
            font-size: 1.6rem;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(255, 77, 109, 0.9);
        }

        @media (max-width: 600px) {
            .main-text { font-size: 1.3rem; }
            .sub-text { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="roseCanvas"></canvas>
        <div id="message-box">
            <div class="main-text">الحمدلله ع السلامه بنوتاتي الحلوات ♥️🌸</div>
            <div class="sub-text">احبج</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('roseCanvas');
        const ctx = canvas.getContext('2d');
        const messageBox = document.getElementById('message-box');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();

        const width = canvas.width;
        const height = canvas.height;
        const centerX = width / 2;
        const baseY = height * 0.9;

        let stemProgress = 0;

        // 1. رسم الساق والأوراق الخضراء بحركة متزنة
        function drawStemAndLeaves() {
            ctx.clearRect(0, 0, width, height);

            // رسم الساق
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#2e5a1c';
            ctx.beginPath();
            ctx.moveTo(centerX, baseY);
            
            let currentY = baseY - (baseY - height * 0.38) * stemProgress;
            let currentX = centerX + Math.sin(stemProgress * Math.PI * 1.5) * 8;
            
            ctx.lineTo(currentX, currentY);
            ctx.stroke();

            // رسم الأوراق الخضراء
            if (stemProgress > 0.35) {
                let leafScale = Math.min((stemProgress - 0.35) * 2, 1);
                drawLeaf(centerX - 4, baseY - (baseY - height * 0.38) * 0.3, -0.6, leafScale);
            }
            if (stemProgress > 0.55) {
                let leafScale = Math.min((stemProgress - 0.55) * 2, 1);
                drawLeaf(centerX + 4, baseY - (baseY - height * 0.38) * 0.5, 0.6, leafScale);
            }

            stemProgress += 0.012; // سرعة انسيابية للساق

            if (stemProgress <= 1) {
                requestAnimationFrame(drawStemAndLeaves);
            } else {
                requestAnimationFrame(drawPetals);
            }
        }

        function drawLeaf(x, y, angle, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.scale(scale, scale);
            
            ctx.beginPath();
            ctx.fillStyle = '#3a7d34';
            ctx.ellipse(25, 0, 26, 10, 0, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = '#1b4017';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            
            ctx.restore();
        }

        // 2. رسم الوردة الحمراء الفخمة (بتلات متدرجة)
        let petalAngle = 0;
        const maxPetalAngle = 14 * Math.PI;
        const roseCenterX = centerX;
        const roseCenterY = height * 0.38;
        const roseSize = Math.min(width, height) * 0.22;

        function drawPetals() {
            // رسم خطوة واحدة فقط في كل إطار للتحكم في السرعة
            if (petalAngle < maxPetalAngle) {
                let k = 6 / 7;
                let r = roseSize * Math.sin(k * petalAngle);
                
                let x = r * Math.cos(petalAngle);
                let y = r * Math.sin(petalAngle);

                // انحناء طبيعي للبتلة
                y -= Math.abs(x) * 0.12;

                ctx.beginPath();
                ctx.arc(roseCenterX + x, roseCenterY + y, 2, 0, Math.PI * 2);
                
                // درجات اللون الأحمر القاني والجميل
                let red = Math.floor(190 + Math.sin(petalAngle) * 65);
                ctx.fillStyle = `rgb(${red}, 15, 45)`;
                ctx.fill();

                petalAngle += 0.035; // سرعة رسم الوردة الفخمة
                requestAnimationFrame(drawPetals);
            } else {
                // ظهور الكلام بالمنتصف وراء اكتمال الرسم
                setTimeout(() => {
                    messageBox.classList.add('show');
                }, 400);
            }
        }

        // إطلاق حركة الرسم
        drawStemAndLeaves();
    </script>
</body>
</html>
