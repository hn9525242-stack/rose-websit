<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفاجأة خاصة ♥️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffdeeb;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 1.5s ease;
        }

        /* الشاشة الوردية تفاعلية */
        #pink-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 1.2s ease, visibility 1.2s ease;
            padding: 20px;
            text-align: center;
        }

        #pink-screen.hide {
            opacity: 0;
            visibility: hidden;
        }

        .kitty-img {
            width: 180px;
            height: 180px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(0 6px 15px rgba(255, 105, 180, 0.45));
        }

        .question-text {
            color: #d63384;
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 25px;
            text-shadow: 0 2px 5px rgba(255, 255, 255, 0.9);
            max-width: 90%;
            line-height: 1.5;
        }

        .buttons-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            background-color: #ff69b4;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-alt {
            background-color: #ff4d6d;
        }

        /* شاشة الرسم الوردية */
        #drawing-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1.5s ease;
        }

        #drawing-screen.show {
            opacity: 1;
            visibility: visible;
        }

        canvas {
            display: block;
        }

        #message-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.85);
            text-align: center;
            opacity: 0;
            transition: opacity 2.5s ease-in-out, transform 2.5s ease-in-out;
            pointer-events: none;
            width: 88%;
            max-width: 550px;
            background: rgba(255, 255, 255, 0.85);
            padding: 25px 20px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 105, 180, 0.5);
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.4);
        }

        #message-box.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .main-text {
            color: #a81c51;
            font-size: 1.8rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .sub-text {
            color: #d63384;
            font-size: 1.6rem;
            font-weight: 600;
            text-shadow: 0 0 8px rgba(255, 182, 193, 0.9);
        }

        @media (max-width: 600px) {
            .main-text { font-size: 1.35rem; }
            .sub-text { font-size: 1.25rem; }
            .question-text { font-size: 1.4rem; }
            .btn { font-size: 1.05rem; padding: 10px 20px; }
            .kitty-img { width: 140px; height: 140px; }
        }
    </style>
</head>
<body>

    <!-- ملف الصوت للأغنية -->
    <audio id="bgMusic" src="song.mp3" preload="auto"></audio>

    <!-- الشاشة الوردية التفاعلية -->
    <div id="pink-screen">
        <img class="kitty-img" id="kitty-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 260'><g fill='none' fill-rule='evenodd'><path fill='%23FFF' stroke='%23000' stroke-width='8' d='M210 55c25 0 45 20 45 45 15 5 25 18 25 33 0 20-20 35-45 35-5 25-25 45-60 45s-55-20-60-45c-25 0-45-15-45-35 0-15 10-28 25-33 0-25 20-45 45-45 10-20 30-35 55-35s45 15 55 35z'/><ellipse cx='150' cy='140' rx='105' ry='80' fill='%23FFF' stroke='%23000' stroke-width='8'/><path fill='%23FFF' stroke='%23000' stroke-width='8' stroke-linejoin='round' d='M65 85 Q 50 20 100 55 Z M235 85 Q 250 20 200 55 Z'/><ellipse cx='105' cy='140' rx='10' ry='15' fill='%23000'/><ellipse cx='195' cy='140' rx='10' ry='15' fill='%23000'/><ellipse cx='150' cy='158' rx='12' ry='8' fill='%23FFC107' stroke='%23000' stroke-width='3'/><path stroke='%23000' stroke-width='7' stroke-linecap='round' d='M220 135l40-8M225 150l45 2M220 165l40 10M80 135l-40-8M75 150l-45 2M80 165l-40 10'/><g fill='%23FF1744' stroke='%23000' stroke-width='7' stroke-linejoin='round'><circle cx='210' cy='75' r='16'/><path d='M210 75 Q 170 45 180 95 Q 210 75 210 75 Z'/><path d='M210 75 Q 250 45 240 95 Q 210 75 210 75 Z'/><circle cx='206' cy='71' r='4' fill='%23FFF' stroke='none'/></g></g></svg>" alt="Hello Kitty">
        
        <div id="question" class="question-text">يا هلا ببنيات گلبي نورتي بغداد يا حلوتي ♥️</div>
        
        <!-- الخطوة 0: الترحيب ببغداد -->
        <div id="step0-btns" class="buttons-container">
            <button class="btn" onclick="startQuestions()">هلا بيك عيني 🌸</button>
        </div>

        <!-- الخطوة 1: تحبيني؟ -->
        <div id="step1-btns" class="buttons-container" style="display: none;">
            <button class="btn" onclick="answerLove()">نعم</button>
            <button class="btn" onclick="answerLove()">طبعاً</button>
        </div>

        <!-- الخطوة 2: تردين ورده؟ -->
        <div id="step2-btns" class="buttons-container" style="display: none;">
            <button class="btn" onclick="askKiss()">نعم 🌹</button>
        </div>

        <!-- الخطوة 3: طلب البوسة لأول مرة -->
        <div id="step3-btns" class="buttons-container" style="display: none;">
            <button class="btn" onclick="startRoseSequence()">أممممحححح 💋</button>
            <button class="btn btn-alt" onclick="rejectKissFirstTime()">لا ماكو بوسة 🙈</button>
        </div>

        <!-- الخطوة 4: التوسل بعد الرفض الأول -->
        <div id="step4-btns" class="buttons-container" style="display: none;">
            <button class="btn" onclick="startRoseSequence()">أممممحححح 💋</button>
            <button class="btn btn-alt" onclick="rejectKissSecondTime()">هم ماكو بوسة 🥺</button>
        </div>

        <!-- الخطوة 5: الإجباري بعد الرفض الثاني -->
        <div id="step5-btns" class="buttons-container" style="display: none;">
            <button class="btn" onclick="startRoseSequence()">أممممحححح 💋</button>
        </div>
    </div>

    <!-- شاشة الرسم الوردية -->
    <div id="drawing-screen">
        <canvas id="roseCanvas"></canvas>
        <div id="message-box">
            <div class="main-text">الحمدلله ع السلامه بنوتاتي الحلوات ♥️🌸</div>
            <div class="sub-text">اموت عليج</div>
        </div>
    </div>

    <script>
        const pinkScreen = document.getElementById('pink-screen');
        const drawingScreen = document.getElementById('drawing-screen');
        const questionText = document.getElementById('question');
        const step0Btns = document.getElementById('step0-btns');
        const step1Btns = document.getElementById('step1-btns');
        const step2Btns = document.getElementById('step2-btns');
        const step3Btns = document.getElementById('step3-btns');
        const step4Btns = document.getElementById('step4-btns');
        const step5Btns = document.getElementById('step5-btns');
        const bgMusic = document.getElementById('bgMusic');

        // الانتقال من الترحيب إلى تحبيني؟
        function startQuestions() {
            step0Btns.style.display = "none";
            questionText.innerText = "تحبيني؟";
            step1Btns.style.display = "flex";
        }

        // 1. تحبيني؟
        function answerLove() {
            questionText.innerText = "اني هم احبج ♥️";
            step1Btns.style.display = "none";

            setTimeout(() => {
                questionText.innerText = "تردين ورده؟ 🌹";
                step2Btns.style.display = "flex";
            }, 1600);
        }

        // 2. شرط البوسة
        function askKiss() {
            questionText.innerText = "تره الوردة مقابل بوسة! انطيني بوسة تاخذين الوردة 💋";
            step2Btns.style.display = "none";
            step3Btns.style.display = "flex";
        }

        // 3. الرفض الأول (هيه بوثه ليث؟ 🥺)
        function rejectKissFirstTime() {
            questionText.innerText = "هيه بوثه ليث؟ 🥺";
            step3Btns.style.display = "none";
            step4Btns.style.display = "flex";
        }

        // 4. الرفض الثاني (إجباري)
        function rejectKissSecondTime() {
            questionText.innerText = "لا غصب تنطيني بوسة! 😡💋";
            step4Btns.style.display = "none";
            step5Btns.style.display = "flex";
        }

        // 5. الانطلاق للرسم وتشغيل الأغنية عند الموافقة
        function startRoseSequence() {
            bgMusic.play().catch(e => console.log("الصوت بانتظار تفاعل"));

            pinkScreen.classList.add('hide');
            document.body.style.backgroundColor = "#ffe3ee";
            
            setTimeout(() => {
                drawingScreen.classList.add('show');
                initCanvas();
                drawRose();
            }, 1000);
        }

        // --- رسم الوردة والقلوب ---
        const canvas = document.getElementById('roseCanvas');
        const ctx = canvas.getContext('2d');
        const messageBox = document.getElementById('message-box');

        let width, height, centerX, centerY, roseSize;

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            width = canvas.width;
            height = canvas.height;
            centerX = width / 2;
            centerY = height / 2;
            roseSize = Math.min(width, height) * 0.38;
        }

        let roseT = 0;
        const maxRoseT = 16 * Math.PI;

        function drawRose() {
            if (roseT < maxRoseT) {
                let k = 7 / 9;
                let r = roseSize * Math.sin(k * roseT);
                
                let x = r * Math.cos(roseT);
                let y = r * Math.sin(roseT);
                y -= Math.abs(x) * 0.1;

                ctx.beginPath();
                ctx.arc(centerX + x, centerY + y, 2.2, 0, Math.PI * 2);
                
                let redVal = Math.floor(200 + Math.sin(roseT) * 55);
                ctx.fillStyle = `rgb(${redVal}, 10, 50)`;
                ctx.shadowColor = 'rgba(214, 51, 132, 0.4)';
                ctx.shadowBlur = 6;
                ctx.fill();

                roseT += 0.022;
                requestAnimationFrame(drawRose);
            } else {
                ctx.shadowBlur = 0;
                requestAnimationFrame(startHeartsDrawing);
            }
        }

        const heartCount = 12;
        let heartIndex = 0;
        let heartProgress = 0;

        function startHeartsDrawing() {
            const heartRadius = roseSize * 1.15;
            if (heartIndex < heartCount) {
                let angle = (heartIndex / heartCount) * Math.PI * 2;
                let hx = centerX + Math.cos(angle) * heartRadius;
                let hy = centerY + Math.sin(angle) * heartRadius;

                drawSingleHeart(hx, hy, 16, heartProgress);

                heartProgress += 0.05;

                if (heartProgress <= 1) {
                    requestAnimationFrame(startHeartsDrawing);
                } else {
                    heartProgress = 0;
                    heartIndex++;
                    requestAnimationFrame(startHeartsDrawing);
                }
            } else {
                setTimeout(() => {
                    messageBox.classList.add('show');
                }, 500);
            }
        }

        function drawSingleHeart(x, y, size, progress) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(progress, progress);
            
            ctx.beginPath();
            ctx.fillStyle = '#e6005c';
            ctx.shadowColor = '#ff69b4';
            ctx.shadowBlur = 10;

            let topCurveHeight = size * 0.3;
            ctx.moveTo(0, topCurveHeight);
            ctx.bezierCurveTo(0, 0, -size / 2, 0, -size / 2, topCurveHeight);
            ctx.bezierCurveTo(-size / 2, (size + topCurveHeight) / 2, 0, size, 0, size * 1.2);
            ctx.bezierCurveTo(0, size, size / 2, (size + topCurveHeight) / 2, size / 2, topCurveHeight);
            ctx.bezierCurveTo(size / 2, 0, 0, 0, 0, topCurveHeight);
            
            ctx.fill();
            ctx.restore();
        }

    </script>
</body>
</html>
